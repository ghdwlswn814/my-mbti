<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBTI로 포켓몬 찾기</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Noto Sans KR", "Malgun Gothic", Arial, sans-serif;
    background: #fff8df;
    color: #5b461e;
  }
  .wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: 48px 20px 60px;
  }
  header { text-align: center; margin-bottom: 30px; }
  h1 {
    margin: 0 0 12px;
    font-size: clamp(34px, 6vw, 58px);
    line-height: 1.15;
    color: #4d3a18;
  }
  .subtitle {
    margin: 0;
    font-size: clamp(18px, 3vw, 23px);
    line-height: 1.6;
  }
  .panel {
    background: #fffdf4;
    border: 3px solid #f1d36b;
    border-radius: 28px;
    padding: 28px;
    box-shadow: 0 10px 30px rgba(120, 91, 25, .10);
  }
  .question {
    text-align: center;
    font-size: 26px;
    font-weight: 800;
    margin: 0 0 22px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }
  .mbti {
    border: 2px solid #ead58c;
    background: #fff4c7;
    color: #594519;
    border-radius: 16px;
    padding: 15px 8px;
    font-size: 20px;
    font-weight: 800;
    cursor: pointer;
    transition: transform .15s, background .15s, border-color .15s;
  }
  .mbti:hover, .mbti:focus {
    transform: translateY(-2px);
    background: #ffe99b;
    border-color: #d9ae32;
    outline: none;
  }
  .result {
    display: none;
    text-align: center;
  }
  .result.show { display: block; }
  .result .label {
    display: inline-block;
    background: #f7d45d;
    color: #5c4617;
    border-radius: 999px;
    padding: 8px 18px;
    font-size: 18px;
    font-weight: 800;
  }
  .emoji {
    font-size: clamp(90px, 18vw, 150px);
    line-height: 1;
    margin: 22px 0 8px;
  }
  .pokemon {
    font-size: clamp(36px, 7vw, 54px);
    margin: 0 0 14px;
    color: #4a3715;
  }
  .reason {
    max-width: 650px;
    margin: 0 auto;
    font-size: 21px;
    line-height: 1.75;
  }
  .compat {
    margin: 28px auto 0;
    max-width: 560px;
    background: #fff1bd;
    border-radius: 20px;
    padding: 18px;
    font-size: 20px;
    line-height: 1.6;
  }
  .compat strong { color: #8a6412; }
  .back {
    margin-top: 25px;
    border: 0;
    background: #e9b83f;
    color: #fffdf4;
    border-radius: 15px;
    padding: 14px 25px;
    font-size: 20px;
    font-weight: 800;
    cursor: pointer;
  }
  .back:hover { background: #d9a52f; }
  .note {
    text-align: center;
    margin-top: 18px;
    color: #806b3d;
    font-size: 14px;
  }
  @media (max-width: 650px) {
    .wrap { padding-top: 30px; }
    .panel { padding: 20px 15px; }
    .grid { grid-template-columns: repeat(2, 1fr); }
    .mbti { font-size: 18px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🌟 MBTI로 포켓몬 찾기 🌟</h1>
    <p class="subtitle">나와 닮은 포켓몬은 누구일까요?<br>MBTI를 골라보세요!</p>
  </header>

  <main class="panel">
    <section id="picker">
      <p class="question">내 MBTI는?</p>
      <div class="grid" id="mbtiGrid"></div>
      <p class="note">재미로 보는 성격 매칭이에요 😊</p>
    </section>

    <section id="result" class="result" aria-live="polite">
      <span class="label" id="typeLabel"></span>
      <div class="emoji" id="emoji"></div>
      <h2 class="pokemon" id="pokemon"></h2>
      <p class="reason" id="reason"></p>
      <div class="compat">
        💛 <strong>잘 맞는 유형</strong><br>
        <span id="compat"></span>
      </div>
      <button class="back" id="backBtn">↩ 다시 고르기</button>
    </section>
  </main>
</div>

<script>
const data = {
  INFP: { pokemon:"이브이", emoji:"🦊", reason:"감성이 풍부하고 상상력이 좋아요.<br>자신만의 방식으로 세상을 바라보는 모습이 이브이와 닮았어요.", compat:"ENFJ" },
  ENFP: { pokemon:"피카츄", emoji:"⚡", reason:"호기심이 많고 새로운 것을 즐겨요.<br>밝은 에너지로 주변까지 신나게 만드는 모습이 피카츄 같아요.", compat:"INFJ" },
  INFJ: { pokemon:"가디안", emoji:"🧚", reason:"조용하지만 깊은 생각과 따뜻한 마음을 가지고 있어요.<br>소중한 사람을 지켜주려는 모습이 가디안과 잘 어울려요.", compat:"ENFP" },
  ENFJ: { pokemon:"루카리오", emoji:"🐺", reason:"사람을 이끌고 도와주는 데 자연스러워요.<br>상대의 마음을 살피고 함께 성장하려는 모습이 루카리오와 닮았어요.", compat:"INFP" },
  ISFP: { pokemon:"치코리타", emoji:"🌱", reason:"편안하고 따뜻한 분위기를 좋아하며 섬세해요.<br>자연스럽고 부드러운 매력이 치코리타와 잘 맞아요.", compat:"ESFJ" },
  ESFP: { pokemon:"꼬부기", emoji:"🐢", reason:"즐거운 순간을 잘 만들고 사람들과 어울리는 것을 좋아해요.<br>밝고 장난스러운 매력이 꼬부기와 닮았어요.", compat:"ISFJ" },
  ISFJ: { pokemon:"해피너스", emoji:"🥚", reason:"꼼꼼하고 다정하며 다른 사람을 챙기는 데 익숙해요.<br>따뜻하게 돌봐주는 모습이 해피너스와 잘 어울려요.", compat:"ESFP" },
  ESFJ: { pokemon:"푸린", emoji:"🎤", reason:"사람들과 함께하는 것을 좋아하고 분위기를 소중히 여겨요.<br>주변을 즐겁게 만드는 푸린 같은 매력이 있어요.", compat:"ISFP" },
  INTJ: { pokemon:"메타그로스", emoji:"🤖", reason:"논리적으로 생각하고 목표를 세워 차근차근 해결해요.<br>강력한 분석력과 계획적인 모습이 메타그로스와 닮았어요.", compat:"ENTP" },
  ENTP: { pokemon:"후딘", emoji:"🥄", reason:"아이디어가 끊이지 않고 새로운 방법을 찾는 걸 좋아해요.<br>재치와 두뇌 회전이 빠른 모습이 후딘과 잘 맞아요.", compat:"INTJ" },
  INTP: { pokemon:"포켓몬 실루엣", emoji:"🔮", reason:"궁금한 것이 생기면 깊게 파고드는 탐구형이에요.<br>혼자 생각하며 새로운 답을 찾아내는 모습이 잘 어울려요.", compat:"ENTJ" },
  ENTJ: { pokemon:"레쿠쟈", emoji:"🐉", reason:"목표를 향해 힘차게 나아가고 결단력이 있어요.<br>큰 그림을 보고 방향을 이끄는 모습이 레쿠쟈와 닮았어요.", compat:"INTP" },
  ISTJ: { pokemon:"거북왕", emoji:"🐢", reason:"책임감이 강하고 해야 할 일을 꾸준히 해내요.<br>든든하고 안정적인 모습이 거북왕과 잘 어울려요.", compat:"ESTP" },
  ESTJ: { pokemon:"마기라스", emoji:"🦖", reason:"현실적인 판단을 좋아하고 목표를 분명하게 세워요.<br>강한 추진력과 책임감이 마기라스 같은 느낌이에요.", compat:"ISTP" },
  ISTP: { pokemon:"에이스번", emoji:"🐰", reason:"직접 해보면서 배우고 상황에 빠르게 대응해요.<br>민첩하고 독립적인 모습이 에이스번과 잘 맞아요.", compat:"ESTJ" },
  ESTP: { pokemon:"리자몽", emoji:"🔥", reason:"행동력이 좋고 눈앞의 기회를 빠르게 잡아요.<br>대담하고 에너지 넘치는 모습이 리자몽과 닮았어요.", compat:"ISTJ" }
};

const grid = document.getElementById("mbtiGrid");
const picker = document.getElementById("picker");
const result = document.getElementById("result");

Object.keys(data).forEach(type => {
  const button = document.createElement("button");
  button.className = "mbti";
  button.textContent = type;
  button.setAttribute("aria-label", type + " 선택");
  button.addEventListener("click", () => showResult(type));
  grid.appendChild(button);
});

function showResult(type) {
  const d = data[type];
  document.getElementById("typeLabel").textContent = type;
  document.getElementById("emoji").textContent = d.emoji;
  document.getElementById("pokemon").textContent = d.pokemon;
  document.getElementById("reason").innerHTML = d.reason;
  document.getElementById("compat").textContent = d.compat;
  picker.style.display = "none";
  result.classList.add("show");
}

document.getElementById("backBtn").addEventListener("click", () => {
  result.classList.remove("show");
  picker.style.display = "block";
  window.scrollTo({ top: 0, behavior: "smooth" });
});
</script>
</body>
</html>
